<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="myhabit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#myhabit-bg)" filter="url(#shadow)"/>
  
  <!-- Subtle Glass Border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="white" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Lucide Vector Checkmark (thick stroke with round caps) -->
  <path d="M19 33.5 L27 41.5 L45 23.5" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lucide Sparkle Accent (4-point star in top-right) -->
  <path d="M47 11.5 L48.1 14.8 C48.3 15.4 48.8 15.9 49.4 16.1 L52.7 17.2 L49.4 18.3 C48.8 18.5 48.3 19 48.1 19.6 L47 22.9 L45.9 19.6 C45.7 19 45.2 18.5 44.6 18.3 L41.3 17.2 L44.6 16.1 C45.2 15.9 45.7 15.4 45.9 14.8 Z" fill="url(#star-grad)"/>
</svg>
