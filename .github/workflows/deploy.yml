name: Deploy MyHabit to Shared Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan trigger deploy manual dari web GitHub

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 3. Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: 4. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 5. Install NPM & Compile Vite Assets
        run: |
          npm ci
          npm run build

      - name: 6. Clean Unnecessary Files Before Upload
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -rf .github

      - name: 7. Deploy to Shared Hosting via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/myhabit/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            storage/logs/*.log
